plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meujogo.autoclick'
    compileSdk 34

    defaultConfig {
        applicationId "com.meujogo.autoclick"
        // 30 = Android 11: necessário para AccessibilityService.takeScreenshot (leitura de cor)
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Sem dependências externas: só o SDK do Android.
