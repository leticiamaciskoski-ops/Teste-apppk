name: Probe API Roblox

# Teste descartável: consulta a API publica do Roblox para confirmar IDs e ordenacao.
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Consultas
        run: |
          UA="Mozilla/5.0 (Linux; Android 13) AutoclickPescaProbe"
          get() { curl -sS -m 20 -A "$UA" -w "\n[HTTP %{http_code}]\n" "$1"; }
          for ID in 10563114921 7861158392; do
            echo "=================== ID $ID"
            echo "--- place -> universe"
            get "https://apis.roblox.com/universes/v1/places/$ID/universe"
            U=$(curl -sS -m 20 -A "$UA" "https://apis.roblox.com/universes/v1/places/$ID/universe" | jq -r '.universeId // empty' 2>/dev/null)
            echo "universeId=$U"
            if [ -n "$U" ]; then
              echo "--- games?universeIds=$U"
              get "https://games.roblox.com/v1/games?universeIds=$U" | head -c 900
            fi
            echo "--- ID como universe"
            get "https://games.roblox.com/v1/games?universeIds=$ID" | head -c 900
          done
          for SORT in Asc Desc; do
            echo "=================== servers 10563114921 sortOrder=$SORT"
            curl -sS -m 25 -A "$UA" -w "\n[HTTP %{http_code}]\n" "https://games.roblox.com/v1/games/10563114921/servers/Public?sortOrder=$SORT&limit=100&excludeFullGames=true" -o /tmp/s_$SORT.json
            tail -c 200 /tmp/s_$SORT.json | head -c 200; echo
            jq -c '{n:(.data|length), playing:[.data[]?.playing], max:[.data[]?.maxPlayers]|unique, next:(.nextPageCursor!=null), sample:(.data[0]|{id,playing,maxPlayers})}' /tmp/s_$SORT.json 2>&1 | head -c 1500
            sleep 2
          done
