name: Probe API Roblox

# Teste descartavel: inspeciona os campos reais da lista de servidores.
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Consultas
        run: |
          UA="Mozilla/5.0 (Linux; Android 13) AutoclickPescaProbe"
          PLACE=107778070777162
          URL="https://games.roblox.com/v1/games/$PLACE/servers/Public"
          curl -sS -m 25 -A "$UA" -o /tmp/Asc1.json -w "Asc1 HTTP %{http_code}\n" "$URL?sortOrder=Asc&limit=100&excludeFullGames=true"
          CUR=$(jq -r '.nextPageCursor // empty' /tmp/Asc1.json)
          curl -sS -m 25 -A "$UA" -o /tmp/Asc2.json -w "Asc2 HTTP %{http_code}\n" -G "$URL" --data-urlencode "sortOrder=Asc" --data-urlencode "limit=100" --data-urlencode "excludeFullGames=true" --data-urlencode "cursor=$CUR"
          curl -sS -m 25 -A "$UA" -o /tmp/Desc1.json -w "Desc1 HTTP %{http_code}\n" "$URL?sortOrder=Desc&limit=100&excludeFullGames=true"
          for f in Asc1 Asc2 Desc1; do
            echo "=================== $f"
            jq -c '{n:(.data|length), keys:([.data[]|keys[]]|unique),
              fps_null:([.data[]|select(.fps==null)]|length),
              fps_le0:([.data[]|select(.fps!=null and .fps<=0)]|length),
              fps_lt30:([.data[]|select(.fps!=null and .fps>0 and .fps<30)]|length),
              ping_null:([.data[]|select(.ping==null)]|length),
              ping_gt300:([.data[]|select(.ping!=null and .ping>300)]|length),
              tokens_mismatch:([.data[]|select((.playerTokens|length)!=.playing)]|length),
              with_playerIds:([.data[]|select(.playerIds!=null and (.playerIds|length)>0)]|length),
              name_nonnull:([.data[]|select(.name!=null)]|length),
              vip_nonnull:([.data[]|select(.vipServerId!=null)]|length),
              fps:([.data[].fps]|{min:min,max:max}), ping:([.data[].ping]|{min:min,max:max}),
              playing_count:([.data[].playing]|group_by(.)|map({p:.[0],n:length}))}' /tmp/$f.json
            echo "--- primeira entrada"
            jq -c '.data[0]' /tmp/$f.json | head -c 700; echo
            echo "--- exemplos com fps/ping nulos ou fps baixo"
            jq -c '[.data[]|select(.fps==null or .ping==null or (.fps!=null and .fps<30))][0:3]' /tmp/$f.json | head -c 1200; echo
          done
