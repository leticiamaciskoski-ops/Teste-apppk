name: Build APK Autoclick

on:
  push:
    paths-ignore:
      - '.github/workflows/probe.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner do GitHub já traz o Android SDK; só garantimos licenças e a plataforma 34.
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Testes da logica do autoclick
        run: |
          chmod +x tests/run-tests.sh
          ./tests/run-tests.sh

      - name: Compilar APK (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: autoclick-pesca-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publica o APK numa página de download (aba Releases), sem precisar entrar em Actions.
      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk autoclick-pesca.apk
          gh release create "apk-${{ github.run_number }}" autoclick-pesca.apk \
            --title "Autoclick Pesca (build ${{ github.run_number }})" \
            --notes "APK de debug gerado automaticamente. Instale no Android 11 ou superior." \
            --latest
