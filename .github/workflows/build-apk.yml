name: Build APK Server Hop

on:
  push:
    paths-ignore:
      - '.github/workflows/probe.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner do GitHub já traz o Android SDK; só garantimos licenças e a plataforma 34.
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Testes da logica do server hop
        run: |
          chmod +x tests/run-tests.sh tests/run-api-tests.sh
          ./tests/run-tests.sh

      - name: Testes da API do Roblox (parse offline)
        run: |
          curl -fsSL -o /tmp/json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          ./tests/run-api-tests.sh /tmp/json.jar offline

      - name: Teste real da API do Roblox (informativo)
        continue-on-error: true
        run: ./tests/run-api-tests.sh /tmp/json.jar live

      - name: Compilar APK (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: server-hop-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publica o APK numa página de download (aba Releases), sem precisar entrar em Actions.
      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk server-hop.apk
          gh release create "apk-${{ github.run_number }}" server-hop.apk \
            --title "Server Hop v0.4 (build ${{ github.run_number }})" \
            --notes "APK de debug do Server Hop. Instale no Android 11 ou superior." \
            --latest
